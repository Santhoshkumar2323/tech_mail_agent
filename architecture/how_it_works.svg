<svg viewBox="0 0 1040 1833" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="1040" height="1833" fill="#ffffff"/>

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
  </marker>
</defs>

<text x="520.0" y="46" text-anchor="middle" font-size="25" font-weight="800" fill="#111827">Deep-Tech Briefing Bot — How It Works</text>
<text x="520.0" y="70" text-anchor="middle" font-size="13.5" fill="#6b7280">Finds new AI/robotics research, has an AI agent judge what's worth reading, and emails a briefing — every 3 days, fully automatic</text>
<text x="520.0" y="90" text-anchor="middle" font-size="11.5" fill="#9ca3af">(pill under each box = the source file that does it)</text>
<text x="140" y="118" font-size="13" font-weight="800" letter-spacing="1.1" fill="#a16207" font-family="Helvetica,Arial,sans-serif">STEP 1 — WAKES ITSELF UP</text>
<rect x="140" y="142" width="760" height="113" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="1.8"/>
<text x="520.0" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12" font-family="Helvetica,Arial,sans-serif">A free scheduler (cron-job.org) pings the bot once a day</text>
<text x="520.0" y="196" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">No server needed — GitHub Actions spins the bot up on demand and shuts it down when done</text>
<rect x="469.95" y="210" width="100.1" height="22" rx="11" fill="#ffffff" stroke="#a16207" stroke-width="1.2" opacity="0.9"/>
<text x="520.0" y="225" text-anchor="middle" font-size="11.5" fill="#a16207" font-family="Menlo,Consolas,monospace" font-weight="600">trigger.yml</text>
<line x1="520.0" y1="255" x2="520.0" y2="295" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text x="110" y="295" font-size="13" font-weight="800" letter-spacing="1.1" fill="#c2410c" font-family="Helvetica,Arial,sans-serif">STEP 2 — CHECKS IF IT'S ACTUALLY TIME</text>
<rect x="110" y="319" width="820" height="131" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="520.0" y="349" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12" font-family="Helvetica,Arial,sans-serif">“Have 3 full days passed since the last briefing was sent?”</text>
<text x="520.0" y="373" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">If not, it stops here and sends nothing. This is why it's safe to ping the bot every single day — most days it just</text>
<text x="520.0" y="391" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">exits in under a second.</text>
<rect x="445.1" y="405" width="149.8" height="22" rx="11" fill="#ffffff" stroke="#c2410c" stroke-width="1.2" opacity="0.9"/>
<text x="520.0" y="420" text-anchor="middle" font-size="11.5" fill="#c2410c" font-family="Menlo,Consolas,monospace" font-weight="600">main.py + state.py</text>
<line x1="520.0" y1="450" x2="520.0" y2="490" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="469.2" y="460.0" width="101.60000000000001" height="18" fill="#ffffff"/>
<text x="520.0" y="474.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Helvetica,Arial,sans-serif">yes → continue</text>
<text x="140" y="490" font-size="13" font-weight="800" letter-spacing="1.1" fill="#1d4ed8" font-family="Helvetica,Arial,sans-serif">STEP 3 — COLLECTS NEW MATERIAL TO CONSIDER</text>
<rect x="85.0" y="514" width="420" height="150" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="295.0" y="545" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" font-family="Helvetica,Arial,sans-serif">New research papers</text>
<text x="295.0" y="570" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Scans 6 research fields on arXiv — AI, robotics,</text>
<text x="295.0" y="588" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">biotech, nanotech and more — for anything published</text>
<text x="295.0" y="606" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">since the last run</text>
<rect x="230.75" y="620" width="128.5" height="22" rx="11" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" opacity="0.9"/>
<text x="295.0" y="635" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-family="Menlo,Consolas,monospace" font-weight="600">ingest_arxiv.py</text>
<rect x="535.0" y="514" width="420" height="132" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="745.0" y="545" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" font-family="Helvetica,Arial,sans-serif">Popular new code projects</text>
<text x="745.0" y="570" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Scans GitHub for repos with 150+ stars, pushed to in the</text>
<text x="745.0" y="588" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">last 3 days, across 6 relevant topics</text>
<rect x="677.2" y="602" width="135.6" height="22" rx="11" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" opacity="0.9"/>
<text x="745.0" y="617" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-family="Menlo,Consolas,monospace" font-weight="600">ingest_github.py</text>
<rect x="140" y="690" width="760" height="132" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="520.0" y="721" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" font-family="Helvetica,Arial,sans-serif">Drops anything already sent before, then a quick keyword scan</text>
<text x="520.0" y="746" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Removes duplicates first, then throws out anything with zero matching keywords — so the AI only reviews</text>
<text x="520.0" y="764" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">genuinely promising items</text>
<rect x="391.85" y="778" width="256.29999999999995" height="22" rx="11" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" opacity="0.9"/>
<text x="520.0" y="793" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-family="Menlo,Consolas,monospace" font-weight="600">main.py (calls both ingest files)</text>
<path d="M 295.0 664 L 295.0 684 L 520.0 684 L 520.0 690" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 745.0 664 L 745.0 684 L 520.0 684 L 520.0 690" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="520.0" y1="822" x2="520.0" y2="862" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text x="100" y="862" font-size="13" font-weight="800" letter-spacing="1.1" fill="#7e22ce" font-family="Helvetica,Arial,sans-serif">STEP 4 — AN AI AGENT READS AND SCORES EVERY ITEM</text>
<rect x="100" y="886" width="840" height="131" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.8"/>
<text x="520.0" y="916" text-anchor="middle" font-size="16" font-weight="700" fill="#3b0764" font-family="Helvetica,Arial,sans-serif">Each paper and project is scored 0–10 for how useful, novel, and practical it is</text>
<text x="520.0" y="940" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Items scoring 8+ move forward. Anything borderline (score 7–8) is automatically re-read with fuller context and</text>
<text x="520.0" y="958" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">double-checked — so nothing promising slips through, without burning AI credits reviewing everything twice.</text>
<rect x="320.85" y="972" width="398.29999999999995" height="22" rx="11" fill="#ffffff" stroke="#7e22ce" stroke-width="1.2" opacity="0.9"/>
<text x="520.0" y="987" text-anchor="middle" font-size="11.5" fill="#7e22ce" font-family="Menlo,Consolas,monospace" font-weight="600">score_agent.py · LangGraph + Groq API (llama-3.3-70b)</text>
<line x1="520.0" y1="1017" x2="520.0" y2="1057" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text x="210" y="1057" font-size="13" font-weight="800" letter-spacing="1.1" fill="#4338ca" font-family="Helvetica,Arial,sans-serif">STEP 5 — KEEPS ONLY THE TOP PICKS</text>
<rect x="210" y="1081" width="620" height="113" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.8"/>
<text x="520.0" y="1111" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b4b" font-family="Helvetica,Arial,sans-serif">Trims the list down to the best 8 items overall</text>
<text x="520.0" y="1135" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Anything that didn't score high enough is discarded here</text>
<rect x="484.15" y="1149" width="71.69999999999999" height="22" rx="11" fill="#ffffff" stroke="#4338ca" stroke-width="1.2" opacity="0.9"/>
<text x="520.0" y="1164" text-anchor="middle" font-size="11.5" fill="#4338ca" font-family="Menlo,Consolas,monospace" font-weight="600">main.py</text>
<line x1="520.0" y1="1194" x2="520.0" y2="1234" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text x="140" y="1234" font-size="13" font-weight="800" letter-spacing="1.1" fill="#15803d" font-family="Helvetica,Arial,sans-serif">STEP 6 — TURNS THE PICKS INTO A BRIEFING</text>
<rect x="85.0" y="1258" width="420" height="172" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="295.0" y="1289" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d" font-family="Helvetica,Arial,sans-serif">Writes a short spoken narration script,</text>
<text x="295.0" y="1311" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d" font-family="Helvetica,Arial,sans-serif">then records it</text>
<text x="295.0" y="1336" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Nice-to-have, not critical — if text-to-speech fails for</text>
<text x="295.0" y="1354" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">any reason, the email still sends normally, just without</text>
<text x="295.0" y="1372" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">audio</text>
<rect x="181.05" y="1386" width="227.89999999999998" height="22" rx="11" fill="#ffffff" stroke="#15803d" stroke-width="1.2" opacity="0.9"/>
<text x="295.0" y="1401" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">score_agent.py → audio_gen.py</text>
<rect x="535.0" y="1258" width="420" height="132" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="745.0" y="1289" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d" font-family="Helvetica,Arial,sans-serif">Writes the readable email report</text>
<text x="745.0" y="1314" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Builds a styled version to look nice, plus a plain-text</text>
<text x="745.0" y="1332" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">version (this helps avoid spam filters)</text>
<rect x="687.85" y="1346" width="114.3" height="22" rx="11" fill="#ffffff" stroke="#15803d" stroke-width="1.2" opacity="0.9"/>
<text x="745.0" y="1361" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">send_email.py</text>
<rect x="150" y="1456" width="740" height="132" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="520.0" y="1487" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d" font-family="Helvetica,Arial,sans-serif">Emails each person on the list separately</text>
<text x="520.0" y="1512" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">One recipient can never see another's address, and one bounced email never blocks the rest. Audio file</text>
<text x="520.0" y="1530" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">attached if it was made.</text>
<rect x="416.7" y="1544" width="206.6" height="22" rx="11" fill="#ffffff" stroke="#15803d" stroke-width="1.2" opacity="0.9"/>
<text x="520.0" y="1559" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">send_email.py → Gmail SMTP</text>
<path d="M 295.0 1430 L 295.0 1450 L 520.0 1450 L 520.0 1456" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 745.0 1430 L 745.0 1450 L 520.0 1450 L 520.0 1456" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="520.0" y1="1588" x2="520.0" y2="1628" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text x="170" y="1628" font-size="13" font-weight="800" letter-spacing="1.1" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">STEP 7 — REMEMBERS, SO IT NEVER REPEATS ITSELF</text>
<rect x="170" y="1652" width="700" height="131" rx="12" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.8"/>
<text x="520.0" y="1682" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">Saves today's date and the IDs of everything just sent</text>
<text x="520.0" y="1706" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">GitHub Actions commits this file straight back into the repo, so the next run (in 3 days) knows</text>
<text x="520.0" y="1724" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">exactly where to pick up</text>
<rect x="423.8" y="1738" width="192.39999999999998" height="22" rx="11" fill="#ffffff" stroke="#4b5563" stroke-width="1.2" opacity="0.9"/>
<text x="520.0" y="1753" text-anchor="middle" font-size="11.5" fill="#4b5563" font-family="Menlo,Consolas,monospace" font-weight="600">state.py → last_run.json</text>
</svg>